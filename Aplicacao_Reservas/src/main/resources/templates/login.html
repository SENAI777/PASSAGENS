<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Login')}"></head>
<body class="login-pagina">
<main class="login-container">
    <form class="login-formulario" th:action="@{/login}" method="post">
        <h1>Reservas de Voo</h1>

        <div th:replace="~{fragments/layout :: mensagens}"></div>

        <label>
            Usuário ou CPF
            <input id="usuario" type="text" name="usuario" autocomplete="username"
                   placeholder="CPF ou usuário" maxlength="14" inputmode="text" required>
        </label>

        <label>
            Senha
            <input type="password" name="senha" autocomplete="current-password" required>
        </label>

        <button class="btn login-botao" type="submit">Entrar</button>
    </form>
</main>
<script>
    const campoUsuario = document.getElementById('usuario');

    campoUsuario.addEventListener('input', () => {
        if (/^\d/.test(campoUsuario.value)) {
            campoUsuario.value = campoUsuario.value
                .replace(/\D/g, '')
                .replace(/(\d{3})(\d)/, '$1.$2')
                .replace(/(\d{3})(\d)/, '$1.$2')
                .replace(/(\d{3})(\d{1,2})$/, '$1-$2')
                .slice(0, 14);
        }
    });
</script>
</body>
</html>
